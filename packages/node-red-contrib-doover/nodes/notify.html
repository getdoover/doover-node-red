<!--
  doover-notify editor template.

  Category "Doover", brand colour, bell icon. Connection selector plus an
  "also record an activity-log entry" option.
-->

<script type="text/javascript">
  RED.nodes.registerType("doover-notify", {
    category: "Doover",
    color: "#8ecae6",
    defaults: {
      name: { value: "" },
      connection: { value: "", type: "doover-connection", required: true },
      recordActivity: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-bell",
    align: "right",
    paletteLabel: "notify",
    label: function () {
      return this.name || "doover notify";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    }
  });
</script>

<script type="text/html" data-template-name="doover-notify">
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-globe"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <div class="form-row">
    <label for="node-input-recordActivity" style="width:auto">
      <input type="checkbox" id="node-input-recordActivity" style="display:inline-block; width:auto; vertical-align:top">
      Also record an activity-log entry
    </label>
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
</script>

<script type="text/html" data-help-name="doover-notify">
  <p>Sends a notification through Doover's notification system.</p>
  <p>Publishes to the <code>notifications</code> channel and records the message
    so it appears in the customer-site activity timeline.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string | object</span></dt>
    <dd>
      The notification text. Non-string values are stringified. To include
      notification metadata, pass an object with <code>message</code> and
      optional <code>title</code>, <code>topic</code>, and <code>severity</code>
      fields. Severity accepts <code>Trace</code>, <code>Debug</code>,
      <code>Info</code>, <code>Warn</code>, or <code>Critical</code>.
    </dd>
  </dl>
  <h3>Options</h3>
  <ul>
    <li><b>Also record an activity-log entry</b> additionally writes the same
      text to the <code>activity_logs</code> channel as an action.</li>
  </ul>
</script>
