<!--
  doover-notify editor template.

  Category "Doover", brand colour, bell icon. Connection selector plus an
  "also record an activity-log entry" option.
-->

<script type="text/javascript">
  RED.nodes.registerType("doover-notify", {
    category: "Doover",
    color: "#8ecae6",
    defaults: {
      name: { value: "" },
      connection: { value: "doover-local-device", type: "doover-connection", required: true },
      message: { value: "payload", required: true },
      messageType: { value: "msg" },
      topic: { value: "topic" },
      topicType: { value: "msg" },
      severity: { value: "severity" },
      severityType: { value: "msg" },
      title: { value: "title" },
      titleType: { value: "msg" },
      recordActivity: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-bell",
    align: "right",
    paletteLabel: "notify",
    label: function () {
      return this.name || "doover notify";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      var types = ["msg", "str", "env", "jsonata"];
      ["message", "topic", "severity", "title"].forEach(function (field) {
        $("#node-input-" + field).typedInput({
          default: "msg",
          typeField: "#node-input-" + field + "Type",
          types: types
        });
      });
    }
  });
</script>

<script type="text/html" data-template-name="doover-notify">
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-globe"></i> Connection</label>
    <input type="text" id="node-input-connection">
  </div>
  <div class="form-row">
    <label for="node-input-message"><i class="fa fa-comment"></i> Message</label>
    <input type="text" id="node-input-message">
    <input type="hidden" id="node-input-messageType">
  </div>
  <div class="form-row">
    <label for="node-input-title"><i class="fa fa-header"></i> Title</label>
    <input type="text" id="node-input-title">
    <input type="hidden" id="node-input-titleType">
  </div>
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-filter"></i> Topic</label>
    <input type="text" id="node-input-topic">
    <input type="hidden" id="node-input-topicType">
  </div>
  <div class="form-row">
    <label for="node-input-severity"><i class="fa fa-exclamation-triangle"></i> Severity</label>
    <input type="text" id="node-input-severity">
    <input type="hidden" id="node-input-severityType">
  </div>
  <div class="form-row">
    <label for="node-input-recordActivity" style="width:auto">
      <input type="checkbox" id="node-input-recordActivity" style="display:inline-block; width:auto; vertical-align:top">
      Also record an activity-log entry
    </label>
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
</script>

<script type="text/html" data-help-name="doover-notify">
  <p>Sends a notification through Doover's notification system.</p>
  <p>Publishes to the <code>notifications</code> channel and records the message
    so it appears in the customer-site activity timeline.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>the notification message by default. Non-strings are stringified.</dd>
    <dt>title <span class="property-type">string</span></dt>
    <dd>the optional notification title by default.</dd>
    <dt>topic <span class="property-type">string</span></dt>
    <dd>the optional subscription-routing topic by default.</dd>
    <dt>severity <span class="property-type">string</span></dt>
    <dd>
      the optional severity by default. Accepted values are <code>Trace</code>,
      <code>Debug</code>, <code>Info</code>, <code>Warn</code>, and
      <code>Critical</code>.
    </dd>
  </dl>
  <h3>Options</h3>
  <ul>
    <li><b>Message, title, topic, and severity</b> can each read a message
      property, use a fixed string or environment variable, or evaluate a
      JSONata expression.</li>
    <li><b>Also record an activity-log entry</b> additionally writes the same
      text to the <code>activity_logs</code> channel as an action.</li>
  </ul>
</script>
