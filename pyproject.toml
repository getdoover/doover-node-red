[project]
name = "doover-node-red"
version = "0.1.0"
description = "Doover device app that runs and supervises the Node-RED runtime on a Doovit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.0.0a8",
]

[project.scripts]
doover-app-run = "doover_node_red:main"
export-config = "doover_node_red.app_config:export"
export-ui = "doover_node_red.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
